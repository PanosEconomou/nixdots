[ config ]

[ templates.quickshell ]
input_path  = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.local/state/quickshell/colors.json"

[ templates.kitty ]
input_path  = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/current-theme.conf"
post_hook   = "pkill -USR1 -f kitty"

[ templates.qutebrowser ]
input_path  = "~/.config/matugen/templates/qutebrowser-colors.json"
output_path = "~/.local/state/qutebrowser/colors.json"
post_hook   = "pgrep -f '[q]utebrowser-wrapped' >/dev/null && qutebrowser ':config-source --clear' >/dev/null 2>&1; true"
